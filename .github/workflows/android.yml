name: Android APK

# Builds an installable debug APK on GitHub's runners (which already have the
# Android SDK), so no local Android SDK is needed. Trigger it manually from the
# Actions tab or with:  gh workflow run "Android APK" --repo <owner>/<repo>
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Show Android SDK location
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk family-groceries.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-groceries-apk
          path: family-groceries.apk
          if-no-files-found: error
          retention-days: 30
